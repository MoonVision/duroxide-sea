[package]
name = "duroxide-sea"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
replay-version-test = ["duroxide/replay-version-test"]

[dependencies]
async-trait = "0.1.89"
duroxide = "0.1.30"
sea-orm = { version = "1.1.20", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = "1.1.20"
semver = "1"
serde_json = "1"
uuid = { version = "1.23.0", features = ["v7"] }

[dev-dependencies]
duroxide = { version = "0.1.30", features = ["provider-test"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
