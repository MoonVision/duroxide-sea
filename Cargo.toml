[package]
name = "duroxide-sea"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
replay-version-test = ["duroxide/replay-version-test"]

[dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["macros", "sync", "time"] }
async-trait = "0.1.92"
duroxide = "=0.1.32"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "2.0.4", default-features = false }
semver = "1"
serde_json = "1"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
duroxide = { version = "=0.1.32", features = ["provider-test"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread"] }
